# Photo robot: finds a CC0 or CC BY photo on iNaturalist for each animal (Costa Rica photos first),
# saves the photographer's name and license, and publishes the website again.
# Run it from the Actions tab → "Find animal photos" → Run workflow. No secret key needed.
name: Find animal photos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "missing = only animals without a card-safe photo · all = look again for every animal (locked photos are kept)"
        type: choice
        options: [missing, all]
        default: missing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for photos on iNaturalist
        run: node scripts/find-photos.mjs ${{ inputs.mode == 'all' && '--all' || '' }}
      - name: Save changes
        id: save
        run: |
          if git diff --quiet; then
            echo "No new photos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "animography-bot"
            git config user.email "animography-bot@users.noreply.github.com"
            git commit -am "Add animal photos (CC0 / CC BY) from iNaturalist"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: photos
    if: needs.photos.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
