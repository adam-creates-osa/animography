# Photo robot: finds a Public domain, CC0 or CC BY photo for each animal (iNaturalist, Wikimedia Commons, GBIF),
# saves the photographer's name and license, and saves the changes to GitHub (Vercel then updates the site).
# Run it from the Actions tab → "Find animal photos" → Run workflow. No secret key needed.
name: Find animal photos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "missing = only animals without a card-safe photo · all = look again for every animal (locked photos are kept)"
        type: choice
        options: [missing, all]
        default: missing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: photo-robot
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Look for photos
        run: node scripts/find-photos.mjs ${{ inputs.mode == 'all' && '--all' || '' }}
      - name: Save changes
        id: save
        run: |
          if git diff --quiet; then
            echo "No new photos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "animography-bot"
            git config user.email "animography-bot@users.noreply.github.com"
            git commit -am "Add animal photos (Public domain / CC0 / CC BY)"
            # If someone pushed while the robot was working, catch up first, then save
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Only needed if you also publish on GitHub Pages. Vercel updates by itself after the robot saves.
  deploy:
    needs: photos
    if: needs.photos.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
